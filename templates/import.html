{% extends "layout.html" %}

{% block title %}Import Operations - Merlin{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1><i data-feather="download" class="me-2"></i>Import Operations</h1>
            <span class="badge bg-secondary">Team: {{ session.team|title }}</span>
        </div>
        
        <div class="card">
            <div class="card-body">
                <form id="importForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="mawb" class="form-label">MAWB Number *</label>
                            <div class="smart-input-container">
                                <input type="text" class="form-control" id="mawb" name="mawb" required 
                                       placeholder="Enter or scan MAWB number">
                                <button type="button" class="btn btn-outline-secondary scan-btn" 
                                        onclick="startScan('mawb')">
                                    <i data-feather="camera"></i>
                                </button>
                            </div>
                            <div class="autocomplete-suggestions" id="mawb-suggestions"></div>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="customs_status" class="form-label">Customs Status *</label>
                            <select class="form-select" id="customs_status" name="customs_status" required>
                                <option value="">Select customs status</option>
                                <option value="Pending">Pending</option>
                                <option value="In Review">In Review</option>
                                <option value="Cleared">Cleared</option>
                                <option value="Hold">Hold</option>
                                <option value="Inspection Required">Inspection Required</option>
                                <option value="Documentation Required">Documentation Required</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="delivery_status" class="form-label">Delivery Status</label>
                            <select class="form-select" id="delivery_status" name="delivery_status">
                                <option value="">Select delivery status</option>
                                <option value="Scheduled">Scheduled</option>
                                <option value="Out for Delivery">Out for Delivery</option>
                                <option value="Delivered">Delivered</option>
                                <option value="Failed Delivery">Failed Delivery</option>
                                <option value="Returned">Returned</option>
                            </select>
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="tracking_number" class="form-label">Tracking Number</label>
                            <div class="smart-input-container">
                                <input type="text" class="form-control" id="tracking_number" name="tracking_number" 
                                       placeholder="Enter tracking number">
                                <button type="button" class="btn btn-outline-secondary scan-btn" 
                                        onclick="startScan('tracking_number')">
                                    <i data-feather="camera"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-3">
                        <label for="notes" class="form-label">Notes</label>
                        <textarea class="form-control" id="notes" name="notes" rows="3" 
                                  placeholder="Enter any additional notes"></textarea>
                    </div>
                    
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary" id="submitBtn">
                            <span class="spinner-border spinner-border-sm me-2 d-none" id="submitSpinner"></span>
                            Update Import Data
                        </button>
                        <button type="reset" class="btn btn-secondary">Clear Form</button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Scanner Modal -->
        <div class="modal fade" id="scannerModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title">
                            <i data-feather="camera" class="me-2"></i>
                            Barcode Scanner
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <div id="reader"></div>
                        <div class="text-center mt-3">
                            <button type="button" class="btn btn-secondary" onclick="stopScan()">
                                Stop Scan
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/import.js') }}"></script>
{% endblock %}
